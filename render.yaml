services:
  - type: web
    name: cloudpulse-ai
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3002
      - key: AWS_REGION
        value: us-east-1
      - key: BEDROCK_MODEL_ID
        value: amazon.nova-pro-v1:0
    healthCheckPath: /api/health
    autoDeploy: true
