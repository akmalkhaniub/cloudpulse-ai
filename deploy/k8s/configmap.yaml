apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudpulse-config
data:
  NODE_ENV: "production"
  PORT: "3002"
  AWS_REGION: "us-east-1"
  BEDROCK_MODEL_ID: "amazon.nova-pro-v1:0"
---
apiVersion: v1
kind: Secret
metadata:
  name: cloudpulse-secrets
type: Opaque
stringData:
  aws-access-key-id: "mock_aws_access_key"
  aws-secret-access-key: "mock_aws_secret_key"
