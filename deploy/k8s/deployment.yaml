apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudpulse-ai
  labels:
    app: cloudpulse-ai
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cloudpulse-ai
  template:
    metadata:
      labels:
        app: cloudpulse-ai
    spec:
      containers:
        - name: cloudpulse-ai
          image: cloudpulse-ai:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3002
              name: http
          envFrom:
            - configMapRef:
                name: cloudpulse-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3002
            initialDelaySeconds: 2
            periodSeconds: 5
